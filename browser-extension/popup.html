<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Second Brain GD</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icons/icon-32.png" alt=""><h1>Second Brain</h1><span id="dot" class="dot" title=""></span></header>

  <section id="pair" hidden>
    <p data-i18n-html="pairIntro"></p>
    <label><span data-i18n="pairingCode"></span> <input id="code" placeholder="ABCD-EFGH" autocomplete="off" spellcheck="false"></label>
    <label><span data-i18n="port"></span> <input id="port" type="number" min="1024" max="65535" value="8765"></label>
    <label class="check"><input id="allow" type="checkbox" checked> <span data-i18n-html="allowOpened"></span></label>
    <button id="pairBtn" class="primary" data-i18n="pair"></button>
  </section>

  <section id="ready" hidden>
    <p id="state" class="muted"></p>
    <button id="send" class="primary" data-i18n="sendPage"></button>
    <button id="sendSel" data-i18n="sendSelection"></button>
    <p id="result" class="result" hidden></p>
    <button id="allowBtn" class="ghost" hidden data-i18n="allowButton"></button>
    <details>
      <summary data-i18n="settings"></summary>
      <p class="muted" data-i18n-html="shortcutHelp"></p>
      <button id="reconnect" class="ghost" data-i18n="reconnect"></button>
      <button id="unpair" class="ghost danger" data-i18n="unpair"></button>
    </details>
  </section>

  <p id="error" class="error" hidden></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
