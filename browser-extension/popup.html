<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Second Brain GD</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icons/icon-32.png" alt=""><h1>Second Brain</h1><span id="dot" class="dot" title=""></span></header>

  <section id="pair" hidden>
    <p>Pair this browser with your Brain. In the app: <b>Captures → Send from browser… → Pair a browser</b>, then enter the code here.</p>
    <label>Pairing code <input id="code" placeholder="ABCD-EFGH" autocomplete="off" spellcheck="false"></label>
    <label>Port <input id="port" type="number" min="1024" max="65535" value="8765"></label>
    <label class="check"><input id="allow" type="checkbox" checked> Also let the Brain read the pages <i>it</i> opens (for « injecte-la » by voice)</label>
    <button id="pairBtn" class="primary">Pair</button>
  </section>

  <section id="ready" hidden>
    <p id="state" class="muted"></p>
    <button id="send" class="primary">Send this page</button>
    <button id="sendSel">Send the selection</button>
    <p id="result" class="result" hidden></p>
    <button id="allowBtn" class="ghost" hidden>Allow reading the pages the Brain opens</button>
    <details>
      <summary>Settings</summary>
      <p class="muted">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>B</kbd> sends the page. Right-click a selection to send just that.</p>
      <button id="reconnect" class="ghost">Reconnect</button>
      <button id="unpair" class="ghost danger">Unpair this browser</button>
    </details>
  </section>

  <p id="error" class="error" hidden></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
