# Runs the automated tests. Never publishes anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engine/requirements.lock
      # The tests load the engine's routes in the runner's own Python: it needs the engine's packages, the same
      # pinned, hash-checked wheels the app installs for itself (engine/installer/steps.py).
      - name: The engine's packages (pinned, hash-checked)
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-input
          --disable-pip-version-check -r engine/requirements.lock
      - name: Unit and integration tests (real venv, real API)
        run: python -m unittest discover -s tests/python -t . -v

  godot:
    name: Godot headless end-to-end
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.lock
      # The tests load the engine's routes in the runner's own Python: it needs the engine's packages, the same
      # pinned, hash-checked wheels the app installs for itself (engine/installer/steps.py).
      - name: The engine's packages (pinned, hash-checked)
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-input
          --disable-pip-version-check -r engine/requirements.lock
      - name: Download Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Godot load check and end-to-end flow
        run: PYTHON=python bash ./tools/test.sh
