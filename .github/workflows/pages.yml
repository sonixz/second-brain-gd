# PREPARED, NOT ACTIVE. Publishes /public to GitHub Pages.
#
# It cannot run by accident:
#   - it has no push trigger, only a manual "Run workflow";
#   - the job is skipped unless the repository variable PUBLISH_SITE is "true";
#   - GitHub Pages must also be enabled in Settings > Pages (source: GitHub Actions).
# Decide on visibility and licence before turning any of these on.
name: Publish site (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.PUBLISH_SITE == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
